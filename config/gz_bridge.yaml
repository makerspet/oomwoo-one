# gz topic published by the simulator core
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# gz topic published by JointState plugin
- ros_topic_name: "joint_states"
  gz_topic_name: "joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# IMU (gz imu sensor -> ROS). Needs the world-level gz-sim-imu-system (see
# urdf/plugins.xacro). Orientation enabled in sim (true attitude); the physical
# gyro has none. IMU fusion is off in config/ekf.yaml for now.
- ros_topic_name: "imu"
  gz_topic_name: "imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# Canonical odometry: whichever source odom_source selects (urdf/plugins.xacro)
# publishes gz /odom -> ROS /odom. Default (truth) is the ground-truth pose.
- ros_topic_name: "odom"
  gz_topic_name: "odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# The NON-canonical odom source, always published for wheel-slip comparison:
# in truth mode the wheel odom is on /odom_wheel; in wheel mode the ground truth
# is on /odom_truth (the other stays empty that run). A slip detector diffs the
# wheel vs the ground-truth stream. See urdf/plugins.xacro for the topic map.
- ros_topic_name: "odom_wheel"
  gz_topic_name: "odom_wheel"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "odom_truth"
  gz_topic_name: "odom_truth"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# gz topic published by DiffDrive plugin
- ros_topic_name: "tf"
  gz_topic_name: "tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# gz topic subscribed to by DiffDrive plugin
- ros_topic_name: "cmd_vel"
  gz_topic_name: "cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# gz topic published by Sensors plugin
- ros_topic_name: "scan"
  gz_topic_name: "scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Front bumper contact sensors (gz contact -> ROS). Note: this is the sim-only
# representation; the physical robot publishes /bumper (vacuum_ros2_bridge/Bumper).
#
# gz-sim ignores a contact sensor's <topic> and publishes ONLY to the auto-scoped
# name below, so gz_topic_name must be the full scoped path. It couples to:
#   world "default"      - both test_room.world and living_room.world use it
#   model "oomwoo_one"   - the spawn -name (this bridge is oomwoo_one-specific)
#   link  "base_footprint" - the canonical root after fixed-joint lumping
# The world must also load gz-sim-contact-system or these stay silent (see
# urdf/plugins.xacro). test/test_bumper_wiring.py checks these names still match.
- ros_topic_name: "bumper_left/contact"
  gz_topic_name: "/world/default/model/oomwoo_one/link/base_footprint/sensor/bumper_left/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS

- ros_topic_name: "bumper_right/contact"
  gz_topic_name: "/world/default/model/oomwoo_one/link/base_footprint/sensor/bumper_right/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS

# Side distance sensors (single-ray gpu_lidar -> ROS). Sim representation of the
# short-range side wall sensors; on the physical robot these are ToF distance
# sensors (vacuum_ros2_bridge, sensor_msgs/Range). gz honours the sensor <topic>,
# so the gz topic is the plain name set in urdf/plugins.xacro.
- ros_topic_name: "range_left"
  gz_topic_name: "range_left"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "range_right"
  gz_topic_name: "range_right"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Front multizone ToF depth sensor (16x8 gpu_lidar -> PointCloud2). Sim of two
# VL53L7CX ToF arrays; gz publishes the point grid on tof_front/points. On the
# physical robot these are per-zone ToF ranges.
- ros_topic_name: "tof_front/points"
  gz_topic_name: "tof_front/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# Front floor camera (gz camera -> ROS Image + CameraInfo). RGB, VGA, wide FoV,
# tilted down at the floor ahead. gz derives the camera_info topic from the image
# topic (.../image -> .../camera_info).
- ros_topic_name: "camera/image"
  gz_topic_name: "camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "camera/camera_info"
  gz_topic_name: "camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
